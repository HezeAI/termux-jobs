name: Fork CI
on:
  push:
    branches: ['fork/**']
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source commit to verify with this workflow (empty = workflow commit)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout CI driver
        uses: actions/checkout@v4
        with:
          path: ci-driver
      - name: Checkout sources under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: source
      - name: Record identities and require fresh X11 caches
        run: |
          mkdir -p .verification/ci
          python3 - <<'PYTHON'
          import json, pathlib, subprocess
          root=pathlib.Path.cwd()
          for name in ('.tools/termux-x11-downloads','.tools/x11-runtime','.tools/x11-components'):
              if (root/name).exists(): raise SystemExit('Unexpected pre-existing cache: '+name)
          sha=lambda path: subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip()
          result=dict(sourceCommit=sha(root),workflowCommit=sha(root.parent/'ci-driver'),x11CachesInitiallyAbsent=True)
          (root/'.verification/ci/identities.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PYTHON
      - name: Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Install pinned Android toolchain
        run: |
          mkdir -p .tools/sdk
          cp -R "$ANDROID_HOME/licenses" .tools/sdk/licenses
          sdkmanager --sdk_root="$PWD/.tools/sdk" "platforms;android-35" "build-tools;30.0.3" "build-tools;35.0.0" "ndk;22.1.7171670"
          mkdir -p .tools/gradle-home
          printf 'android.aapt2FromMavenOverride=%s\n' "$PWD/.tools/sdk/build-tools/35.0.0/aapt2" > .tools/gradle-home/gradle.properties
      - name: Prepare verified ARM64 X11 inputs
        run: |
          set -euo pipefail
          export FORK_X11_CLANG="$PWD/.tools/sdk/ndk/22.1.7171670/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          python3 ../ci-driver/scripts/prepare-x11.py --root "$PWD" | tee .verification/ci/x11-preparation.log
      - name: Java 11 for Gradle and Android project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify pinned X11 inputs
        run: |
          source scripts/build-env.sh
          ./gradlew --no-daemon :x11:verifyX11Inputs
      - name: Check locale resources
        run: python3 scripts/check-localization.py
      - name: Preparation helper tests
        run: |
          mkdir -p ../ci-driver/.verification
          python3 -B -m unittest discover -s ../ci-driver/scripts/tests -p test_prepare_x11.py -v
      - name: Unit tests
        run: |
          source scripts/build-env.sh
          # Same suites as check.sh plus the X11 module. Keep Unix socket fixture
          # paths below sockaddr_un's limit. Use a real task-local directory:
          # a symlink would invalidate canonical-path/security fixture assumptions.
          mkdir "$RUNNER_TEMP/tj"
          export JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS -Djava.io.tmpdir=$RUNNER_TEMP/tj"
          ./gradlew --no-daemon :terminal-emulator:testDebugUnitTest :terminal-view:testDebugUnitTest :termux-shared:testDebugUnitTest :app:testDebugUnitTest :x11:testDebugUnitTest
      - name: Build debug APK
        run: ./scripts/build-debug.sh
      - uses: actions/upload-artifact@v4
        with:
          name: termux-fork-debug
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Test reports and preparation identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          include-hidden-files: true
          path: |
            source/**/build/reports/tests/
            source/**/build/test-results/
            source/.verification/ci/
            source/.tools/x11-runtime/verified.json
          if-no-files-found: warn

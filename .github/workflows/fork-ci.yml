name: Fork CI
on:
  push:
    branches: ['fork/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Install pinned Android toolchain
        run: |
          mkdir -p .tools/sdk
          cp -R "$ANDROID_HOME/licenses" .tools/sdk/licenses
          sdkmanager --sdk_root="$GITHUB_WORKSPACE/.tools/sdk" "platforms;android-30" "build-tools;30.0.3" "ndk;22.1.7171670"
      - name: Java 11 for Gradle and Android project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Check locale resources
        run: python3 scripts/check-localization.py
      - name: Unit tests
        run: ./scripts/check.sh
      - name: Build debug APK
        run: ./scripts/build-debug.sh
      - uses: actions/upload-artifact@v4
        with:
          name: termux-fork-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

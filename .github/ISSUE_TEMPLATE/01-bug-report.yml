{
  "name": "Ошибка Termux Job’s",
  "description": "X11/graphics/programs, backups, updates, UI, AI Agents, SSH or presets",
  "title": "[Bug]: ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Это трекер Termux Job’s. Проверьте существующие Issues. Уберите из логов и скриншотов токены, ключи и авторизацию. Ubuntu и инструменты устанавливаются отдельно. Полные бэкапы не прикладывайте: в них могут быть секреты."
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "Что произошло и что ожидалось?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Шаги воспроизведения",
        "description": "Укажите раздел приложения и команды без секретов. Для последовательности сообщите, остаётся ли первый шаг интерактивным. Для вложений: агент/CLI, тип/размер, источник, с текстом или без, остался ли черновик; без личного файла, API-ключа или кода входа."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "environment",
      "attributes": {
        "label": "Версии и окружение",
        "value": "Версия Termux Job’s:\nИсточник APK и прежняя версия при обновлении:\nAndroid и модель устройства:\nЯзык интерфейса / системный язык:\nСреда: Termux / Ubuntu / SSH / AI Agents:\nВерсия proot-distro, если проблема в Ubuntu:\nРазмер системного шрифта / масштаб экрана:\nОткрыта ли клавиатура, поворот или разделённый экран:\nДля X11: окружение, рендер, стиль, вертикальный/горизонтальный вид:\nДля медиа: плеер, кодеки, подготовлены ли «Видео и аудио» (без личных файлов):\nЧистая установка или обновление:\nАгент и версия CLI / Node.js:\nСпособ входа (без ключей/токенов), модель и режим:\nРасширенный debug включён до запуска? Журнал приостановлен?:\nРежим доступа, новый чат или продолжение:\nДля пакетов: имя/версия, действие, выбранная или новая сессия:\nДля редактора: тип/кодировка/размер файла, права, ссылки/внешние изменения (без содержимого):\nДля категории: команда/заметка, создание/редактирование:\nДля бэкапа: формат, исходные/целевые версии Termux и proot-distro, полный/по выбору, компоненты, gzip/pigz/уровень, этап/код ошибки (без архивов):\nДля обновления: установленный versionCode, тег релиза, галочка Авто, открытие/возврат/поворот и результат ручной проверки:\nДля выбора/передачи файлов: источник (Termux/proot/память), состояние доступа, число файлов, этап и ошибка без секретов:\nДля справочника: ID/заголовок карточки, система, способ запуска и источник решения:\nДля сервера: удаление/передача, было ли выделение или В фон, ошибка/частичный результат:\nДля бэкапа: первый или повторный вход/Обновить, метод gzip/pigz, потоки и уровень:\nДля чата v2.0: фокус/текст ввода, карточки действий/навыков и статусы; чат приложения или робот-терминал; Свернуть/Вернуться в чат; активный запрос и клавиатура:\nДля файлов: выделение/навигация/Выбрать всё, фильтр, копирование/перемещение и частичный результат:\nДля X11: окружение/версия, чистая или существующая установка, CPU/Turnip+Zink/VirGL/Wrapper/Bionic-for-glibc, ZIP драйвера/SHA-256/источник и GPU/API, этап запуска или программа, режим клавиатуры, приложите X11-диагностику без секретов:\nДля чатов v2.0.8: Markdown (код/таблица/список), потоковый ответ, Копировать/Развернуть, вложение (тип/размер/количество, окружение/память/галерея), черновик/отправлено, сортировка, Stop/индикатор и частота экрана:\nДля Alias v2.0.9: окружение, shell, создание/удаление/импорт/экспорт, перезапуск вкладки и безопасный код ошибки (без команд с секретами):\nДля масштаба чата: агент, процент, системный размер шрифта/экрана, сообщения/карточки/ввод и переключение сессии:\n"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Дополнительные сведения",
        "description": "Очищенные логи, скриншоты или запись экрана. Не прикладывайте auth.json, credentials, приватные ключи или keystore. Для диагностики: шестерёнка сессии → отчёт в Download. Отчёт не является полным HTTP trace. Для Сервер + Agent: ОС/Python сервера, раздел, безопасный код ошибки, backend/часовой пояс расписания или кодек медиа. Не прикладывайте URL с медиатокеном и секретные серверные команды."
      }
    }
  ]
}
